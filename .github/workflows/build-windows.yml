name: Build Windows executable
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Test
        run: .venv/Scripts/python.exe scripts/test.py
      - name: Build public package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CAM-Local-Windows
          path: dist/CAM-Local-Windows-publico.zip
