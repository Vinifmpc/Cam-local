name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cam-local-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: ')
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Select and validate release version
        shell: pwsh
        env:
          CAM_INPUT_TAG: ${{ inputs.tag }}
          CAM_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $camTag = $env:CAM_INPUT_TAG
          if (-not $camTag) {
            $camFirstLine = ($env:CAM_COMMIT_MESSAGE -split "`n")[0].Trim()
            if ($camFirstLine -notmatch '^release: (v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?)$') {
              throw 'Use a commit title such as release: v0.1.0'
            }
            $camTag = $Matches[1]
          }
          if ($camTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag' }
          "CAM_RELEASE_TAG=$camTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Test engine and interface
        run: .venv/Scripts/python.exe scripts/test.py --report dist/tests.json
      - name: Build public Windows package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish release and verified package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $camPackage = 'dist/CAM-Local-Windows-publico.zip'
          $camDigest = (Get-FileHash -LiteralPath $camPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          "$camDigest  CAM-Local-Windows-publico.zip" | Set-Content -LiteralPath 'dist/SHA256SUMS-publico.txt' -Encoding ascii
          gh release create $env:CAM_RELEASE_TAG $camPackage 'dist/SHA256SUMS-publico.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CAM Local $env:CAM_RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; existing releases are never overwritten.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: dist/tests.json
